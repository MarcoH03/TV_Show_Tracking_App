<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="Track the shows you watch, rewatch and want to watch — episodes, ratings, lists and new-episode alerts." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
